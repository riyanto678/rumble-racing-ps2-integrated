name: Rumble Racing PS2 Special Edition

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  android:
    name: Build integrated Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Set up Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build ARMSX2 Android app with Rumble Racing identity
        working-directory: platforms/android
        run: |
          ./gradlew :app:assembleGithubDebug --stacktrace \
            -Parmsx2.applicationId=com.rumbleracing.ps2 \
            "-Parmsx2.appLabel=Rumble Racing PS2"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RumbleRacingPS2-SpecialEdition-APK
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
