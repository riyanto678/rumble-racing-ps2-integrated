name: Build Rumble Racing PS2 (ARMSX2 integrated)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  android:
    name: Rumble Racing PS2 Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned NDK and CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc dependencies
        working-directory: platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build integrated Android APK
        working-directory: platforms/android
        run: |
          ./gradlew :app:assembleGithubDebug --stacktrace \
            -Parmsx2.applicationId=com.rumbleracing.ps2 \
            "-Parmsx2.appLabel=Rumble Racing PS2"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RumbleRacingPS2-ARMSX2-Android
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
